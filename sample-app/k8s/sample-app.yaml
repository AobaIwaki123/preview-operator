apiVersion: v1
kind: Namespace
metadata:
  name: preview-sample
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: preview-sample
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: ghcr.io/aobaiwaki123/preview-sample-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAME
              value: "Preview Environment Sample"
            - name: PR_NUMBER
              value: "101"
            - name: COMMIT_SHA
              value: "preview-init-sha"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: preview-sample
spec:
  selector:
    app: sample-app
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
  namespace: preview-sample
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: sample-preview.aooba.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app
                port:
                  number: 8080
